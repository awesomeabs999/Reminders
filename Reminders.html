<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminders</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
            padding: 2rem;
            max-width: 680px;
            margin: 0 auto;
            transition: background 0.2s, color 0.2s;
        }

        body.dark {
            background: #0f0f0f;
            color: #e5e5e5;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        body.dark h1 {
            color: #e5e5e5;
        }

        .theme-toggle {
            padding: 0.5rem 0.75rem;
            background: transparent;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            font-size: 0.875rem;
            cursor: pointer;
            color: #666;
        }

        body.dark .theme-toggle {
            border-color: #333;
            color: #999;
        }

        .theme-toggle:hover {
            background: #f0f0f0;
            color: #1a1a1a;
        }

        body.dark .theme-toggle:hover {
            background: #1a1a1a;
            color: #e5e5e5;
        }

        .add-form {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        input,
        select {
            padding: 0.625rem 0.875rem;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            font-size: 0.875rem;
            background: #fff;
            color: #1a1a1a;
            outline: none;
        }

        body.dark input,
        body.dark select {
            background: #1a1a1a;
            border-color: #333;
            color: #e5e5e5;
        }

        input:focus,
        select:focus {
            border-color: #007aff;
        }

        input::placeholder {
            color: #a0a0a0;
        }

        #assignmentInput {
            flex: 1;
            min-width: 0;
        }

        #dueDateInput {
            width: 140px;
        }

        #priorityInput {
            width: 110px;
        }

        .add-btn {
            padding: 0.625rem 1.25rem;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
        }

        body.dark .add-btn {
            background: #e5e5e5;
            color: #0f0f0f;
        }

        .add-btn:hover {
            background: #333;
        }

        body.dark .add-btn:hover {
            background: #ccc;
        }

        .assignments-list {
            list-style: none;
        }

        .assignment-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 1px solid #f0f0f0;
        }

        body.dark .assignment-item {
            border-bottom-color: #1a1a1a;
        }

        .assignment-item:last-child {
            border-bottom: none;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #d0d0d0;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        body.dark .checkbox {
            border-color: #444;
        }

        .checkbox.checked {
            background: #1a1a1a;
            border-color: #1a1a1a;
        }

        body.dark .checkbox.checked {
            background: #e5e5e5;
            border-color: #e5e5e5;
        }

        .checkbox.checked::after {
            content: "✓";
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
        }

        body.dark .checkbox.checked::after {
            color: #0f0f0f;
        }

        .assignment-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .assignment-name {
            font-size: 0.9375rem;
            overflow-wrap: anywhere;
        }

        body.dark .assignment-name {
            color: #e5e5e5;
        }

        .assignment-item.completed .assignment-name {
            color: #a0a0a0;
            text-decoration: line-through;
        }

        .assignment-meta {
            font-size: 0.75rem;
            color: #888;
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        body.dark .assignment-meta {
            color: #666;
        }

        .priority-badge {
            padding: 0.125rem 0.5rem;
            border-radius: 4px;
            font-size: 0.6875rem;
            font-weight: 500;
            text-transform: uppercase;
        }

        .priority-high {
            background: #fee2e2;
            color: #dc2626;
        }

        .priority-medium {
            background: #fef3c7;
            color: #d97706;
        }

        .priority-low {
            background: #d1fae5;
            color: #059669;
        }

        .delete-btn {
            padding: 0.375rem 0.625rem;
            background: transparent;
            color: #a0a0a0;
            border: none;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            opacity: 0;
        }

        .assignment-item:hover .delete-btn,
        .delete-btn:focus {
            opacity: 1;
        }

        .delete-btn:hover {
            background: #fee2e2;
            color: #dc2626;
        }

        .empty-state {
            text-align: center;
            color: #a0a0a0;
            font-size: 0.875rem;
            padding: 3rem 0;
        }

        .stats {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #f0f0f0;
        }

        body.dark .stats {
            color: #666;
            border-bottom-color: #1a1a1a;
        }

        @media (max-width: 600px) {
            body {
                padding: 1.25rem;
            }

            .add-form {
                flex-wrap: wrap;
            }

            #assignmentInput {
                flex-basis: 100%;
            }

            #dueDateInput,
            #priorityInput,
            .add-btn {
                flex: 1;
                width: auto;
            }

            .delete-btn {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <h1>Reminders</h1>
        <button id="themeToggle" class="theme-toggle" type="button">
            Dark
        </button>
    </header>

    <form id="addForm" class="add-form">
        <input
            id="assignmentInput"
            type="text"
            placeholder="Add an assignment..."
            autocomplete="off"
            required
        >

        <input id="dueDateInput" type="date">

        <select id="priorityInput">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select>

        <button class="add-btn" type="submit">Add</button>
    </form>

    <div id="stats" class="stats"></div>

    <ul id="assignmentsList" class="assignments-list"></ul>

    <script>
        const STORAGE_KEY = "assignments";
        const THEME_KEY = "theme";

        let assignments = loadAssignments();
        let isDark = localStorage.getItem(THEME_KEY) === "dark";

        function loadAssignments() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                return Array.isArray(saved) ? saved : [];
            } catch {
                return [];
            }
        }

        function saveAssignments() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(assignments));
        }

        function applyTheme() {
            document.body.classList.toggle("dark", isDark);
            document.getElementById("themeToggle").textContent =
                isDark ? "Light" : "Dark";
        }

        function toggleTheme() {
            isDark = !isDark;
            localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
            applyTheme();
        }

        function formatDate(dateString) {
            if (!dateString) return "";

            const date = new Date(`${dateString}T00:00:00`);

            return date.toLocaleDateString("en-US", {
                month: "short",
                day: "numeric"
            });
        }

        function addAssignment(name, dueDate, priority) {
            assignments.push({
                id: Date.now(),
                name,
                dueDate,
                priority,
                completed: false
            });

            saveAssignments();
            render();
        }

        function toggleComplete(id) {
            assignments = assignments.map(assignment =>
                assignment.id === id
                    ? {
                        ...assignment,
                        completed: !assignment.completed
                    }
                    : assignment
            );

            saveAssignments();
            render();
        }

        function deleteAssignment(id) {
            assignments = assignments.filter(
                assignment => assignment.id !== id
            );

            saveAssignments();
            render();
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function render() {
            const list = document.getElementById("assignmentsList");
            const stats = document.getElementById("stats");

            const total = assignments.length;
            const completed = assignments.filter(
                assignment => assignment.completed
            ).length;
            const remaining = total - completed;

            if (total === 0) {
                stats.textContent = "";
                list.innerHTML =
                    '<li class="empty-state">No assignments yet</li>';
                return;
            }

            stats.textContent =
                `${remaining} remaining • ${completed} completed`;

            const priorityOrder = {
                high: 0,
                medium: 1,
                low: 2
            };

            const sortedAssignments = [...assignments].sort((a, b) => {
                if (a.completed !== b.completed) {
                    return a.completed ? 1 : -1;
                }

                return (
                    (priorityOrder[a.priority] ?? 1) -
                    (priorityOrder[b.priority] ?? 1)
                );
            });

            list.innerHTML = sortedAssignments.map(assignment => `
                <li class="assignment-item ${
                    assignment.completed ? "completed" : ""
                }">
                    <button
                        class="checkbox ${
                            assignment.completed ? "checked" : ""
                        }"
                        type="button"
                        aria-label="${
                            assignment.completed
                                ? "Mark incomplete"
                                : "Mark complete"
                        }"
                        onclick="toggleComplete(${assignment.id})">
                    </button>

                    <div class="assignment-info">
                        <div class="assignment-name">
                            ${escapeHtml(assignment.name)}
                        </div>

                        <div class="assignment-meta">
                            <span class="priority-badge priority-${
                                assignment.priority
                            }">
                                ${assignment.priority}
                            </span>

                            ${
                                assignment.dueDate
                                    ? `<span>Due ${formatDate(
                                        assignment.dueDate
                                    )}</span>`
                                    : ""
                            }
                        </div>
                    </div>

                    <button
                        class="delete-btn"
                        type="button"
                        onclick="deleteAssignment(${assignment.id})">
                        Delete
                    </button>
                </li>
            `).join("");
        }

        document
            .getElementById("themeToggle")
            .addEventListener("click", toggleTheme);

        document
            .getElementById("addForm")
            .addEventListener("submit", event => {
                event.preventDefault();

                const input = document.getElementById("assignmentInput");
                const dueDate = document.getElementById("dueDateInput");
                const priority = document.getElementById("priorityInput");

                const name = input.value.trim();

                if (!name) return;

                addAssignment(name, dueDate.value, priority.value);

                input.value = "";
                dueDate.value = "";
                priority.value = "medium";
                input.focus();
            });

        applyTheme();
        render();
    </script>
</body>
</html>
